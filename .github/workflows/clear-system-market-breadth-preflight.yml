name: Clear System - Market Breadth Data Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Clear System/research/market_breadth_preflight.py'
      - '.github/workflows/clear-system-market-breadth-preflight.yml'

concurrency:
  group: clear-system-market-breadth-preflight
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime
        timeout-minutes: 5
        run: pip install --disable-pip-version-check 'numpy<3' 'pandas<4' 'requests<3'
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          P='gpt/Clear System/research/market_breadth_preflight.py'
          python -m py_compile "$P" 'gpt/Clear System/research/taker_flow_preflight.py'
          python "$P" --self-test --outdir /tmp/breadth-selftest
      - name: Static causality and schema audit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('gpt/Clear System/research/market_breadth_preflight.py').read_text()
          req=['REFERENCES','BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT',
               'DOGEUSDT','breadth_accel','ignition','Timedelta(minutes=15)']
          missing=[x for x in req if x not in s]
          assert not missing,missing
          assert 'shift(-' not in s,'future shift forbidden'
          assert s.count('USDT"') >= 6
          print('static audit ok')
          PY
      - name: Real-data smoke and reference completeness audit
        timeout-minutes: 15
        run: |
          set -euo pipefail
          O='gpt/Clear System/output/market_breadth_preflight'
          timeout 13m python 'gpt/Clear System/research/market_breadth_preflight.py' \
            --start 2025-01-01 --end 2026-09-18 --outdir "$O"
          test -s "$O/summary.json"
          python - <<'PY'
          import json
          p='gpt/Clear System/output/market_breadth_preflight/summary.json'
          s=json.load(open(p))
          assert s['status']=='BREADTH_DATA_READY',s
          assert s['reference_count']==6,s
          assert len(s['rows'])==6,s
          assert len({x['symbol'] for x in s['rows']})==6,s
          assert min(x['coverage_pct'] for x in s['rows'])>=95,s
          assert s['common_coverage_pct']>=95,s
          assert s['ignition_events']>=50,s
          print(s['status'],s['common_rows'],s['ignition_events'])
          PY
      - name: Persist verified audit
        run: |
          set -euo pipefail
          O='gpt/Clear System/output/market_breadth_preflight'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$O"
          git diff --cached --quiet && exit 0
          git commit -m 'Persist Clear System market-breadth preflight [skip ci]'
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-breadth-preflight
          path: gpt/Clear System/output/market_breadth_preflight
          if-no-files-found: warn
          retention-days: 14
