name: GPT - Indicator Augmentation Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/indicator_augmentation_discovery.py'
      - '.github/workflows/gpt-indicator-augmentation-discovery.yml'

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Build extra-indicator features
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/indicator_augmentation_discovery.py \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --outdir /tmp/indicator-aug/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-aug-shard-${{ matrix.shard }}
          path: /tmp/indicator-aug/shard-${{ matrix.shard }}
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
      - name: Discover stable augmentation filters
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/indicator_augmentation_discovery.py \
            --aggregate-dir /tmp/indicator-aug-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/output
      - name: Persist compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/output/summary.json \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/output/single_filters.csv \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_augmentation_discovery/output/pair_filters.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist indicator augmentation discovery results [skip ci]"
            git push
          fi
