name: RETRIGGER High Guard 2026

on:
  push:
    paths:
      - "research/retrigger_high_guard_2026/**"
      - ".github/workflows/retrigger-high-guard-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: research/retrigger_high_guard_2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests flask

      - name: Verify imports and syntax
        run: |
          python -m py_compile retrigger_high_guard_2026.py
          python -c "import flask, numpy, pandas, requests"

      - name: Replay 478 USDT spot universe
        run: |
          python retrigger_high_guard_2026.py \
            --start 2026-01-01 \
            --end 2026-09-20 \
            --output retrigger_high_guard_2026_result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrigger-high-guard-2026
          path: research/retrigger_high_guard_2026/retrigger_high_guard_2026_result.json
          if-no-files-found: warn
          retention-days: 14
