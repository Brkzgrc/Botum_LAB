name: Tukenme arastirmasi

# Saatte bir calisir, her seferinde bir parca isler ve birikimi commit eder.
# Kaldigi yerden devam eder (durum.json). Is bitince kendini durdurur.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      parca:
        description: "Bu kosuda islenecek coin sayisi"
        default: "120"

permissions:
  contents: write

concurrency:
  group: tukenme
  cancel-in-progress: false

jobs:
  kos:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install --quiet numpy requests

      - name: Kalan is var mi
        id: kontrol
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          kok = "2026-09-16_tukenme"
          ev = json.load(open(f"{kok}/evren.json"))
          try: bitti = set(json.load(open(f"{kok}/durum.json"))["bitti"])
          except Exception: bitti = set()
          kalan = len(ev)*2 - len(bitti)
          print(f"kalan={kalan}")
          PY

      - name: Parcayi kos
        if: steps.kontrol.outputs.kalan != '0'
        run: |
          cd 2026-09-16_tukenme
          python3 -u kosucu.py "${{ github.event.inputs.parca || 120 }}" 18000

      - name: Sonucu kaydet
        if: steps.kontrol.outputs.kalan != '0'
        run: |
          git config user.name  "tukenme-bot"
          git config user.email "noreply@anthropic.com"
          git add 2026-09-16_tukenme/durum.json 2026-09-16_tukenme/birikim.npz
          git diff --cached --quiet || git commit -m "tukenme: parca islendi [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((2**i))
          done

      - name: Is bittiyse bildir
        if: steps.kontrol.outputs.kalan == '0'
        run: echo "Tum isler bitti. Workflow'u kapatabilirsiniz."
