name: GPT - Frozen Candidate Outcome Extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/frozen_candidate_outcome_extension.py'
      - '.github/workflows/gpt-frozen-candidate-outcome-extension.yml'

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --disable-pip-version-check numpy pandas requests

      - name: Download frozen-candidate source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35292657185

      - name: Test Outcome-First extensions on frozen TSI+BB candidate
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/frozen_candidate_outcome_extension.py \
            --artifact-dir /tmp/indicator-aug-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/output \
            --workers 12

      - name: Persist compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/output/summary.json \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/output/single_rules.csv \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/frozen_candidate_outcome_extension/output/pair_rules.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist frozen candidate outcome extension results [skip ci]"
            git push
          fi
