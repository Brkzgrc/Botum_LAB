name: Clear System - PRESSURE Multi-Period Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clear-system-pressure-multiperiod-preflight.yml'

concurrency:
  group: clear-system-pressure-multiperiod-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded runtime
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4' 'requests<3' 'flask<4'
      - name: Compile and self-test replay plus aggregate
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m py_compile \
            'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' \
            'gpt/Clear System/research/pressure_confirmation/pressure_multiperiod_aggregate.py' \
            'gpt/Clear System/sources/botum_2026-09-26/spot_opportunity_scanner.py' \
            'gpt/Clear System/sources/botum_2026-09-26/tsi_bb_frozen_candidate.py'
          python 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' --self-test
          python 'gpt/Clear System/research/pressure_confirmation/pressure_multiperiod_aggregate.py' --self-test
      - name: Static causality universe and scope audit
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          paths=[Path('gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py'),
                 Path('gpt/Clear System/research/pressure_confirmation/pressure_multiperiod_aggregate.py')]
          text='\n'.join(p.read_text() for p in paths)
          for p in paths: ast.parse(p.read_text())
          required=('close_time < current','open_time >= entry_time','conservative_stop_first',
                    'mfe_pct_24h','mae_pct_24h','COOLDOWNS_H','expected_shards')
          assert all(x in text for x in required), 'missing causal/metric contract'
          assert 'HTTP.post' not in text and 'requests.post' not in text
          assert 'shift(-' not in text and '2026-09-22' not in text
          print('static multi-period audit ok')
          PY

  replay:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: q1
            start: 2025-02-15T00:00:00Z
            end: 2025-02-16T12:00:00Z
          - shard: q2
            start: 2025-05-15T00:00:00Z
            end: 2025-05-16T12:00:00Z
          - shard: q3
            start: 2025-08-15T00:00:00Z
            end: 2025-08-16T12:00:00Z
          - shard: q4
            start: 2025-11-15T00:00:00Z
            end: 2025-11-16T12:00:00Z
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded runtime
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4' 'requests<3' 'flask<4'
      - name: Compile shard code
        timeout-minutes: 1
        run: python -m py_compile 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py'
      - name: Fixed-calendar real-data replay shard
        timeout-minutes: 19
        env:
          SHARD: ${{ matrix.shard }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          out="gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod/$SHARD"
          mkdir -p "$out"
          timeout 17m python 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' \
            --history-start 2025-01-01T00:00:00Z \
            --replay-start "$START" --replay-end "$END" \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,LINKUSDT,AVAXUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,TRXUSDT,LTCUSDT,SUIUSDT \
            --allow-zero-signals --outdir "$out" 2>&1 | tee "$out/run.log"
          python - "$out/summary.json" "$SHARD" <<'PY'
          import json,sys
          p=sys.argv[1]; x=json.load(open(p)); x['shard']=sys.argv[2]
          open(p,'w').write(json.dumps(x,indent=2,allow_nan=False)+'\n')
          PY
      - name: Verify shard symbol and time completeness
        timeout-minutes: 1
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - "$SHARD" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod')/sys.argv[1]/'summary.json'
          x=json.loads(p.read_text())
          assert x['status']=='PRESSURE_REPLAY_PREFLIGHT_PASSED' and x['shard']==sys.argv[1]
          assert x['expected_shards']==x['completed_shards']==1
          assert x['expected_symbols']==x['completed_symbols']==12 and len(x['coverage'])==12
          assert min(r['coverage_pct'] for r in x['coverage'])>=98 and x['scan_count']>=100
          print('shard complete',sys.argv[1],x['signal_count'])
          PY
      - name: Preserve shard evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-multiperiod-${{ matrix.shard }}
          path: gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod/${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    if: always()
    needs: [preflight, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate runtime
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4'
      - name: Download all shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pressure-multiperiod-*
          path: downloaded
      - name: Aggregate and fail on missing shard
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out='gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod/aggregate'
          mkdir -p "$out"
          python 'gpt/Clear System/research/pressure_confirmation/pressure_multiperiod_aggregate.py' \
            --input-root downloaded --output "$out/summary.json" 2>&1 | tee "$out/run.log"
      - name: Verify aggregate metrics
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod/aggregate/summary.json')
          x=json.loads(p.read_text())
          assert x['status']=='PRESSURE_MULTIPERIOD_PREFLIGHT_PASSED'
          assert len(x['expected_shards'])==len(x['completed_shards'])==4
          assert x['observed_days']==6 and set(x['cooldown_ablation'])=={'0','6','12','24','48'}
          assert 'mfe_pct_24h' in x and 'mae_pct_24h' in x and x['oos'].startswith('N/A')
          print('aggregate evidence complete')
          PY
      - name: Preserve aggregate on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-multiperiod-aggregate
          path: gpt/Clear System/research/pressure_confirmation/output/pressure_multiperiod/aggregate
          if-no-files-found: warn
          retention-days: 14
