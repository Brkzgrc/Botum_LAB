name: GPT - BTC MTF Reversal Large Study

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/mtf_reversal_propagation/mtf_reversal_propagation.py'
      - '.github/workflows/gpt-btc-mtf-large-study.yml'

permissions:
  contents: write

concurrency:
  group: gpt-btc-mtf-large-study
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests

      - name: Run large historical study
        run: python gpt/Multi-Timeframe-Independent-Evidence/large_studies/mtf_reversal_propagation/mtf_reversal_propagation.py

      - name: Persist research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpt/Multi-Timeframe-Independent-Evidence/large_studies/mtf_reversal_propagation/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist BTC MTF reversal large-study results [skip ci]"
            git push
          fi
