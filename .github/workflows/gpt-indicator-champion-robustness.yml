name: GPT - Indicator Champion Robustness

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/indicator_champion_robustness.py'
      - '.github/workflows/gpt-indicator-champion-robustness.yml'

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35292657185
      - name: Run frozen robustness audit
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/indicator_champion_robustness.py \
            --aggregate-dir /tmp/indicator-aug-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/output
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/output/summary.json \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/indicator_champion_robustness/output/holdout_symbol_contribution.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist frozen indicator champion robustness audit [skip ci]"
            git push
          fi
