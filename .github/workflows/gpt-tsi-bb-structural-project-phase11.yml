name: GPT - TSI BB Structural Project Phase 11 Regime Conditioned

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/TSI_BB_Structural_Phase/src/phase11_regime_conditioned_trajectory.py'
      - '.github/workflows/gpt-tsi-bb-structural-project-phase11.yml'

permissions:
  actions: read
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Download frozen indicator artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35292657185
      - name: Run Phase 11
        run: |
          cd gpt/TSI_BB_Structural_Phase/src
          python phase11_regime_conditioned_trajectory.py --artifact-dir /tmp/indicator-aug-artifacts --outdir ../results/phase11
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add gpt/TSI_BB_Structural_Phase/results/phase11
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Persist TSI BB Phase 11 [skip ci]" && git push; fi
