name: GPT - r2 Staged Entry Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/**'
      - '.github/workflows/gpt-r2-staged-entry.yml'

permissions:
  actions: read
  contents: write

jobs:
  staged_entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --disable-pip-version-check numpy pandas
      - name: Download verified round2 dataset
        uses: actions/download-artifact@v4
        with:
          name: r2-round2-dataset
          path: /tmp/r2-round2-dataset
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35452406018
      - name: Static compile preflight
        run: python -m py_compile gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/r2_staged_entry.py
      - name: Dataset/baseline preflight
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/r2_staged_entry.py             --dataset-dir /tmp/r2-round2-dataset             --outdir /tmp/r2-staged-preflight             --preflight
      - name: Run staged entry audit
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/r2_staged_entry.py             --dataset-dir /tmp/r2-round2-dataset             --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/output
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpt/Multi-Timeframe-Independent-Evidence/large_studies/r2_staged_entry/output
          git diff --cached --quiet && exit 0
          git commit -m "Persist r2 staged entry audit [skip ci]"
          git pull --rebase origin main
          git push
