name: Clear System - PRESSURE Path Exit Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clear-system-pressure-path-exit-preflight.yml'

concurrency:
  group: clear-system-pressure-path-exit-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded runtime
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4' 'requests<3' 'flask<4'
      - name: Compile and deterministic self-tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m py_compile \
            'gpt/Clear System/research/pressure_confirmation/pressure_path_exit.py' \
            'gpt/Clear System/research/pressure_confirmation/pressure_path_exit_aggregate.py' \
            'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' \
            'gpt/Clear System/sources/botum_2026-09-26/spot_opportunity_scanner.py' \
            'gpt/Clear System/sources/botum_2026-09-26/portfolio_tracker.py'
          python 'gpt/Clear System/research/pressure_confirmation/pressure_path_exit.py'
          python 'gpt/Clear System/research/pressure_confirmation/pressure_path_exit_aggregate.py' --self-test
          python 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' --self-test
      - name: Static source parity causality and scope audit
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          root=Path('gpt/Clear System')
          path=(root/'research/pressure_confirmation/pressure_path_exit.py').read_text()
          replay=(root/'research/pressure_confirmation/pressure_replay_preflight.py').read_text()
          agg=(root/'research/pressure_confirmation/pressure_path_exit_aggregate.py').read_text()
          scanner=(root/'sources/botum_2026-09-26/spot_opportunity_scanner.py').read_text()
          tracker=(root/'sources/botum_2026-09-26/portfolio_tracker.py').read_text()
          for text in (path,replay,agg): ast.parse(text)
          assert 'TRAIL_TYPE       = os.getenv("SPOT_TRAIL_TYPE", "atr")' in scanner
          assert 'TRAIL_MULT       = float(os.getenv("SPOT_TRAIL_MULT", "0.6"))' in scanner
          assert 'TRAIL_FLOOR      = "entry"' in scanner
          assert 'TP1 bir kapanış değil' in tracker and 'spot_opportunity_trail_stop' in tracker
          required=('source_atr_trail','closed_hour_atr','protect_0.50_floor_0.20',
                    'staged50_0.50_then_1.50_floor0.20','motion_fade_after0.50',
                    'time_48h','FEE_PCT = 0.20')
          assert all(x in path for x in required)
          text=path+'\n'+replay+'\n'+agg
          assert 'shift(-' not in text and 'requests.post' not in text and 'HTTP.post' not in text
          assert 'hours: int = 72' in path and 'pd.Timedelta(hours=72)' in replay
          assert 'INCOMPLETE_SHARDS' in agg and 'CENSORED' in agg
          print('static path-exit audit ok')
          PY
      - name: One-symbol real-data path-engine smoke
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out=/tmp/pressure-path-real-smoke
          mkdir -p "$out"
          timeout 4m python - "$out/summary.json" <<'PY'
          import json,sys
          from pathlib import Path
          import pandas as pd
          root=Path('gpt/Clear System/research/pressure_confirmation')
          sys.path.insert(0,str(root))
          import pressure_replay_preflight as r
          import pressure_path_exit as p
          hs=pd.Timestamp('2024-10-01T00:00:00Z'); at=pd.Timestamp('2025-02-15T00:00:00Z')
          raw15=r.fetch('BTCUSDT','15m',hs,at+pd.Timedelta(hours=73))
          raw5=r.fetch('BTCUSDT','5m',at,at+pd.Timedelta(hours=72))
          entry=float(raw5.iloc[0].close)
          z=p.evaluate_all(raw5,raw15,at,entry,entry*.95,entry*1.01)
          assert set(z)==set(p.PATH_POLICIES) and len(raw15)>10000 and len(raw5)>800
          assert all(pd.Timestamp(v['exit_time'])>=at for v in z.values())
          out={'status':'PATH_ENGINE_REAL_DATA_SMOKE_PASSED','symbol':'BTCUSDT',
               'period':[str(at),str(at+pd.Timedelta(hours=72))],
               'rows_15m':len(raw15),'rows_5m':len(raw5),'policies':z}
          Path(sys.argv[1]).write_text(json.dumps(out,indent=2,allow_nan=False)+'\n')
          print(json.dumps({'status':out['status'],'rows_15m':len(raw15),'rows_5m':len(raw5)}))
          PY
      - name: Preserve preflight evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-path-exit-preflight
          path: /tmp/pressure-path-real-smoke
          if-no-files-found: warn
          retention-days: 14

  replay:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: q1
            start: 2025-02-15T00:00:00Z
            end: 2025-02-16T12:00:00Z
          - shard: q2
            start: 2025-05-15T00:00:00Z
            end: 2025-05-16T12:00:00Z
          - shard: q3
            start: 2025-08-15T00:00:00Z
            end: 2025-08-16T12:00:00Z
          - shard: q4
            start: 2025-11-15T00:00:00Z
            end: 2025-11-16T12:00:00Z
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded runtime
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4' 'requests<3' 'flask<4'
      - name: Compile shard code
        timeout-minutes: 1
        run: python -m py_compile 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' 'gpt/Clear System/research/pressure_confirmation/pressure_path_exit.py'
      - name: Fixed-calendar real-data path replay
        timeout-minutes: 21
        env:
          SHARD: ${{ matrix.shard }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          out="gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit/$SHARD"
          mkdir -p "$out"
          timeout 19m python 'gpt/Clear System/research/pressure_confirmation/pressure_replay_preflight.py' \
            --history-start 2024-10-01T00:00:00Z \
            --replay-start "$START" --replay-end "$END" \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,LINKUSDT,AVAXUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,TRXUSDT,LTCUSDT,SUIUSDT \
            --allow-zero-signals --outdir "$out" 2>&1 | tee "$out/run.log"
          python - "$out/summary.json" "$SHARD" <<'PY'
          import json,sys
          p=sys.argv[1]; x=json.load(open(p)); x['shard']=sys.argv[2]
          open(p,'w').write(json.dumps(x,indent=2,allow_nan=False)+'\n')
          PY
      - name: Verify shard data and path-policy completeness
        timeout-minutes: 1
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - "$SHARD" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'gpt/Clear System/research/pressure_confirmation')
          from pressure_path_exit import PATH_POLICIES
          p=Path('gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit')/sys.argv[1]/'summary.json'
          x=json.loads(p.read_text())
          assert x['status']=='PRESSURE_REPLAY_PREFLIGHT_PASSED' and x['shard']==sys.argv[1]
          assert x['expected_symbols']==x['completed_symbols']==12 and len(x['coverage'])==12
          assert min(r['coverage_pct'] for r in x['coverage'])>=98 and x['scan_count']>=100
          assert all(set(e['path_policies'])==set(PATH_POLICIES) for e in x['signals'])
          print('path shard complete',sys.argv[1],x['signal_count'])
          PY
      - name: Preserve shard evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-path-exit-${{ matrix.shard }}
          path: gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit/${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    if: always()
    needs: [preflight, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate runtime
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<4'
      - name: Download all shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pressure-path-exit-q*
          path: downloaded
      - name: Aggregate and fail on missing shard
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out='gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit/aggregate'
          mkdir -p "$out"
          python 'gpt/Clear System/research/pressure_confirmation/pressure_path_exit_aggregate.py' \
            --input-root downloaded --output "$out/summary.json" 2>&1 | tee "$out/run.log"
      - name: Verify aggregate metrics
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit/aggregate/summary.json')
          x=json.loads(p.read_text())
          assert x['status']=='PRESSURE_PATH_EXIT_PREFLIGHT_PASSED'
          assert x['expected_shards']==x['completed_shards']==['q1','q2','q3','q4']
          assert x['observed_days']==6 and x['fee_pct']==0.20
          assert len(x['policies'])==10 and x['signals']>0
          assert x['oos'].startswith('N/A') and 'capital slots' in x['limitations']
          print('path aggregate evidence complete',x['signals'])
          PY
      - name: Preserve aggregate on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-path-exit-aggregate
          path: gpt/Clear System/research/pressure_confirmation/output/pressure_path_exit/aggregate
          if-no-files-found: warn
          retention-days: 14
