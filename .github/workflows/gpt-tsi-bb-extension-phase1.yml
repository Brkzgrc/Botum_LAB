name: GPT - TSI BB Extension Phase 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/btc-frozen-reversal-fingerprint-validation/tsi_bb_extension_research/phase1_frequency_quality_search.py'
      - '.github/workflows/gpt-tsi-bb-extension-phase1.yml'

permissions:
  actions: read
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Download frozen indicator artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35292657185
      - name: Run phase 1 frequency-quality search
        run: |
          python gpt/btc-frozen-reversal-fingerprint-validation/tsi_bb_extension_research/phase1_frequency_quality_search.py             --artifact-dir /tmp/indicator-aug-artifacts             --outdir gpt/btc-frozen-reversal-fingerprint-validation/tsi_bb_extension_research/output
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add gpt/btc-frozen-reversal-fingerprint-validation/tsi_bb_extension_research/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist TSI BB extension phase 1 [skip ci]"
            git push
          fi
