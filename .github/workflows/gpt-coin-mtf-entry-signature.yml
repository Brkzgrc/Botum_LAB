name: GPT - Coin MTF Entry Signature

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/coin_mtf_entry_signature/entry_signature_discovery.py'
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/coin_mtf_entry_signature/entry_signature_discovery_v2.py'
      - '.github/workflows/gpt-coin-mtf-entry-signature.yml'

permissions:
  contents: write

concurrency:
  group: gpt-coin-mtf-entry-signature
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests scikit-learn

      - name: Run strictly causal entry-signature discovery
        run: python gpt/Multi-Timeframe-Independent-Evidence/large_studies/coin_mtf_entry_signature/entry_signature_discovery_v2.py

      - name: Persist research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpt/Multi-Timeframe-Independent-Evidence/large_studies/coin_mtf_entry_signature/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist coin MTF entry-signature research results [skip ci]"
            git push
          fi
