# Phase 13 intersection-regime trajectory research
name: GPT - TSI BB Structural Project Phase 13 Intersection Regime

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/TSI_BB_Structural_Phase/src/phase13_multires_motif_similarity.py'
      - '.github/workflows/gpt-tsi-bb-structural-project-phase13.yml'

permissions:
  actions: read
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Download frozen indicator artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: indicator-aug-shard-*
          path: /tmp/indicator-aug-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Brkzgrc/Botum_LAB
          run-id: 35292657185
      - name: Run Phase 13
        run: |
          cd gpt/TSI_BB_Structural_Phase/src
          rm -rf /tmp/phase13-results
          python phase13_multires_motif_similarity.py --artifact-dir /tmp/indicator-aug-artifacts --outdir /tmp/phase13-results
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          rm -rf gpt/TSI_BB_Structural_Phase/results/phase13
          mkdir -p gpt/TSI_BB_Structural_Phase/results/phase13
          cp -a /tmp/phase13-results/. gpt/TSI_BB_Structural_Phase/results/phase13/
          git add gpt/TSI_BB_Structural_Phase/results/phase13
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Persist TSI BB Phase 13 [skip ci]" && git push; fi
