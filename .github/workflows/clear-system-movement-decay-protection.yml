name: Clear System - D6 Movement Decay Protection

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clear-system-d6-movement-decay
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  ENGINE: gpt/Clear System/research/pressure_confirmation/movement_decay_protection/movement_decay_protection.py
  PREREG: gpt/Clear System/research/pressure_confirmation/movement_decay_protection/preregistration.json

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded runtime
        run: pip install --disable-pip-version-check pandas numpy requests
      - name: Compile and deterministic self-test
        run: |
          set -euo pipefail
          python -m py_compile "$ENGINE"
          timeout 60s python "$ENGINE" --self-test | tee preflight-selftest.log
      - name: Static causality contract and budget audit
        run: |
          set -euo pipefail
          python - <<'PY' | tee preflight-static.log
          import ast, json, pathlib
          engine = pathlib.Path("gpt/Clear System/research/pressure_confirmation/movement_decay_protection/movement_decay_protection.py")
          prereg = pathlib.Path("gpt/Clear System/research/pressure_confirmation/movement_decay_protection/preregistration.json")
          source, p = engine.read_text(), json.loads(prereg.read_text())
          tree = ast.parse(source)
          assert "used.close_time > exit_time" in source
          assert "post_exit_rows_used" in source
          assert "pressure_fullmarket_benchmark" not in source
          assert p["immutable_contract"]["entry_rule_unchanged"] is True
          assert p["immutable_contract"]["one_frozen_variant"] is True
          assert p["immutable_contract"]["no_parameter_sweep"] is True
          assert p["immutable_contract"]["no_30_or_60_minute_forced_gate"] is True
          assert p["immutable_contract"]["no_post_exit_or_future_peak_features"] is True
          assert p["development_stage"]["expected_events"] == 324
          assert p["action_budget_for_2024_path_replay"]["hard_runner_minute_ceiling_from_job_timeouts"] == 64
          assert source.count('"DECAY_EXIT"') >= 2
          assert "consecutive_votes >= 2" in source
          assert not any(isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
                         and n.func.id in {"eval", "exec"} for n in ast.walk(tree))
          print("D6_STATIC_CAUSALITY_CONTRACT_OK")
          PY
      - name: Real Binance closed-5m smoke
        run: |
          set -euo pipefail
          timeout 180s python "$ENGINE" --smoke | tee preflight-real-smoke.log
      - name: Preserve preflight evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-movement-decay-preflight
          path: preflight-*.log
          if-no-files-found: warn
          retention-days: 14

  quarter:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - quarter: Q1
            artifact_id: "10931444044"
            digest: "6ba59bf73e2c05f8857da7e02d6cf9de6e9d8e9c3e0b36a7c485ad5bf3c5a7f2"
          - quarter: Q2
            artifact_id: "10931536922"
            digest: "5988cd0523ee0c9b46048d243e2828eb1b46cd5508af7810e9a4337d736687f2"
          - quarter: Q3
            artifact_id: "10932245174"
            digest: "bcbe8d4348d15fb1020fa9986b1284eb4f6c33aa6b01a93d2659b11cb06e3579"
          - quarter: Q4
            artifact_id: "10931636682"
            digest: "1615815b301ff19624c73bf6ad3ab836b903eb79ffc53216bcbad93665bb3437"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded runtime
        run: pip install --disable-pip-version-check pandas numpy requests
      - name: Download and digest-check archived quarter
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > source.zip
          test "$(sha256sum source.zip | cut -d' ' -f1)" = "$EXPECTED_DIGEST"
          unzip -q source.zip -d source
          test -s source/summary.json
      - name: Compile quarter engine
        run: python -m py_compile "$ENGINE"
      - name: Replay frozen D6 causal paths
        run: |
          set -euo pipefail
          mkdir -p "output-${{ matrix.quarter }}"
          timeout 8m python "$ENGINE" --quarter "${{ matrix.quarter }}" \
            --input source/summary.json --output "output-${{ matrix.quarter }}" \
            2>&1 | tee "quarter-${{ matrix.quarter }}.log"
      - name: Verify quarter schema and no post-exit use
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          q = "${{ matrix.quarter }}"
          p = json.loads(pathlib.Path(f"output-{q}/summary.json").read_text())
          assert p["status"] == "D6_QUARTER_COMPLETE"
          assert p["quarter"] == q and p["events"] > 0
          assert all(r["diagnostic"]["post_exit_rows_used"] == 0 for r in p["records"])
          assert sum(p["baseline_outcomes"].values()) == p["events"]
          assert sum(p["protected_outcomes"].values()) == p["events"]
          print(q, p["events"], p["baseline_outcomes"], p["protected_outcomes"])
          PY
      - name: Preserve quarter evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-movement-decay-${{ matrix.quarter }}
          path: |
            output-${{ matrix.quarter }}/
            quarter-${{ matrix.quarter }}.log
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: quarter
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded runtime
        run: pip install --disable-pip-version-check pandas numpy requests
      - name: Download every quarter artifact
        uses: actions/download-artifact@v4
        with:
          pattern: d6-movement-decay-Q*
          path: quarters
      - name: Compile aggregate
        run: python -m py_compile "$ENGINE"
      - name: Fail closed on missing or duplicate quarter and aggregate
        run: |
          set -euo pipefail
          timeout 120s python "$ENGINE" --aggregate --input-root quarters \
            --output aggregate 2>&1 | tee aggregate.log
      - name: Verify final development contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p = json.loads(pathlib.Path("aggregate/summary.json").read_text())
          assert p["status"] == "D6_DEVELOPMENT_COMPLETE"
          assert p["events"] == 324
          assert p["baseline"]["outcomes"] == {"TARGET_FIRST": 285, "STOP_FIRST": 32, "EXPIRED": 7}
          assert p["integrity"]["quarters"] == ["Q1", "Q2", "Q3", "Q4"]
          assert p["integrity"]["post_exit_rows_used"] == 0
          assert p["integrity"]["baseline_reproduction"] == "exact"
          assert p["decision"] in {"OPEN_2025_FORWARD", "REJECT_D6_NO_2025"}
          assert set(p["gate_checks"]) == {
              "exact_baseline_reproduction", "net_improvement", "profit_factor",
              "target_preservation", "negative_pnl_reduction", "worst_loss_reduction",
              "quarter_improvement", "post_exit_rows_zero"
          }
          print(json.dumps({"baseline": p["baseline"], "protected": p["protected"],
                            "gate_checks": p["gate_checks"], "decision": p["decision"]}, indent=2))
          PY
      - name: Preserve aggregate on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-movement-decay-aggregate
          path: |
            aggregate/
            aggregate.log
          if-no-files-found: warn
          retention-days: 14
