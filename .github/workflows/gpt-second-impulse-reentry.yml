name: GPT - Second Impulse Reentry

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/second_impulse_reentry.py'
      - '.github/workflows/gpt-second-impulse-reentry.yml'

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run second-impulse reentry shard
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/second_impulse_reentry.py \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --outdir /tmp/second-impulse/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: second-impulse-shard-${{ matrix.shard }}
          path: /tmp/second-impulse/shard-${{ matrix.shard }}
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: second-impulse-shard-*
          path: /tmp/second-impulse-artifacts
      - name: Aggregate second-impulse discovery
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/second_impulse_reentry.py \
            --aggregate-dir /tmp/second-impulse-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/output
      - name: Persist compact output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/output/summary.json \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/second_impulse_reentry/output/policy_ranking.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist second-impulse reentry results [skip ci]"
            git push
          fi
