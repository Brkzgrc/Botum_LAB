name: GPT - Event Path Morphology

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/event_path_morphology.py'
      - '.github/workflows/gpt-event-path-morphology.yml'

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run path-morphology shard
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/event_path_morphology.py \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --outdir /tmp/event-path/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: event-path-shard-${{ matrix.shard }}
          path: /tmp/event-path/shard-${{ matrix.shard }}
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: event-path-shard-*
          path: /tmp/event-path-artifacts
      - name: Aggregate morphology study
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/event_path_morphology.py \
            --aggregate-dir /tmp/event-path-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/output
      - name: Persist compact morphology output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/event_path_morphology/output/summary.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist event-path morphology results [skip ci]"
            git push
          fi
