name: GPT - Loss Veto Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/loss_veto_discovery.py'
      - '.github/workflows/gpt-loss-veto-discovery.yml'

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Build causal loss-veto features
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/loss_veto_discovery.py \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --outdir /tmp/loss-veto/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: loss-veto-shard-${{ matrix.shard }}
          path: /tmp/loss-veto/shard-${{ matrix.shard }}
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: loss-veto-shard-*
          path: /tmp/loss-veto-artifacts
      - name: Aggregate loss-veto discovery
        run: |
          python gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/loss_veto_discovery.py \
            --aggregate-dir /tmp/loss-veto-artifacts \
            --outdir gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/output
      - name: Persist compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/output/REPORT.md \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/output/summary.json \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/output/single_vetoes.csv \
            gpt/Multi-Timeframe-Independent-Evidence/large_studies/loss_veto_discovery/output/pair_vetoes.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Persist loss-veto discovery results [skip ci]"
            git push
          fi
