name: GPT - Multi-Timeframe Stage4 Forward

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpt-multitf-forward.yml"
      - "gpt/Multi-Timeframe-Independent-Evidence/reports/stage2/regime_model.json"

permissions:
  contents: write

concurrency:
  group: gpt-multitf-forward
  cancel-in-progress: false

jobs:
  shadow-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOT: gpt/Multi-Timeframe-Independent-Evidence

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen model preflight
        id: preflight
        shell: bash
        run: |
          MODEL="$ROOT/reports/stage2/regime_model.json"
          if [ -f "$MODEL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frozen Stage-2 regime model bulundu."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "BEKLEMEDE: $MODEL henüz repoda yok; trading kuralları değiştirilmeden koşu atlandı."
          fi

      - name: Setup Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: gpt/Multi-Timeframe-Independent-Evidence/requirements.txt

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r "$ROOT/requirements.txt"

      - name: Run one frozen forward cycle
        if: steps.preflight.outputs.ready == 'true'
        run: python -u "$ROOT/run_stage4_github.py"

      - name: Persist Stage4 state
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "gpt-stage4-bot"
          git config user.email "gpt-stage4-bot@users.noreply.github.com"
          git add "$ROOT/data/stage4" "$ROOT/reports/stage4" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni Stage4 state yok."
            exit 0
          fi
          git commit -m "gpt stage4: forward state update [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "State push başarısız oldu."
          exit 1
